# Vale prose linter (ADR-0056). Checks ACTIVE documentation for superseded terms.
# Historical records (ADRs, backlog history, analysis snapshots, design import logs,
# design notes) keep the names valid at their time and are excluded below; the V1/V2
# inventory describes the prototypes in their own terms (see its naming note); generated
# files that quote other text (CHANGELOG.md, docs/development/exceptions.md) are excluded too.
StylesPath = .vale/styles
MinAlertLevel = error

[*.md]
BasedOnStyles = SoS

[{docs/architecture/0*.md,docs/backlog.md,docs/design/design-notes.md,docs/analysis/*.md,docs/design/imports/*.md,docs/product/v1-v2-inventory.md,CHANGELOG.md,docs/development/exceptions.md}]
BasedOnStyles =
