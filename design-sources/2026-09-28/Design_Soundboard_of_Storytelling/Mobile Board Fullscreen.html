<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#08081A" />
  <title>Soundboard — Board (mobile)</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="mb.css" />

  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #root { height: 100dvh; width: 100vw; }
    /* edge-to-edge: drop the desktop page chrome + the fake status/home bars,
       and respect the real device safe areas (notch + home indicator). */
    .mb-statusbar, .mb-homebar { display: none !important; }
    .mb-phone {
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    /* a touch more top breathing room under the notch for the mode toggle */
    .mb-topbar { padding-top: 10px; }
    * { -webkit-tap-highlight-color: transparent; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect width="100" height="100" fill="#0E0E22"/>
      <rect x="30" y="30" width="17" height="17" fill="#D4B25C"/>
      <rect x="53" y="30" width="17" height="17" fill="#6DB5B8"/>
      <rect x="30" y="53" width="17" height="17" fill="#9D7FC7"/>
      <rect x="53" y="53" width="17" height="17" fill="#C9529D"/>
    </svg>
  </template>

  <script type="text/babel" src="mb-data.jsx"></script>
  <script type="text/babel" src="mb-sheet.jsx"></script>
  <script type="text/babel" src="mb-board.jsx"></script>
  <script type="text/babel" src="mb-fullscreen.jsx"></script>

  <style id="__om-edit-overrides"></style>
</body>
</html>
