name: Weekly check

# Runs the full test suite once a week even when nobody pushes (T8c, 2026-09-29):
# new advisories against unchanged packages, runner/browser changes and forgotten
# Dependabot PRs surface without a push. (A failing Dependabot PR stayed unnoticed
# for two months before this existed.)
#
# A red run is the notification: GitHub mails failed scheduled runs. Warnings alone
# would go unseen, so stale Dependabot PRs fail the maintenance job on purpose.
# Note: GitHub disables schedules in public repos after 60 days without activity.
on:
  schedule:
    - cron: '0 6 * * 1' # Monday 06:00 UTC — after Dependabot's Monday run
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  # The exact suite of tests.yml (reused, not copied — cannot drift).
  tests:
    uses: ./.github/workflows/tests.yml

  maintenance:
    runs-on: ubuntu-latest
    env:
      STALE_DAYS: 14
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: v3/package-lock.json

      - name: Install dependencies
        working-directory: v3
        run: npm ci

      - name: npm audit — all levels (report; high/critical already block in tests)
        working-directory: v3
        run: |
          {
            echo '## npm audit (all levels)'
            echo '```'
            npm audit || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: npm outdated (report)
        working-directory: v3
        run: |
          {
            echo '## npm outdated'
            echo '```'
            npm outdated || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Vale version (report; Vale is pinned outside npm — ADR-0056)
        run: |
          PINNED=$(grep -oE "VALE_VERSION = '[0-9.]+'" v3/scripts/vale-install.ts | grep -oE "[0-9.]+")
          LATEST=$(gh api repos/vale-cli/vale/releases/latest --jq .tag_name | sed 's/^v//')
          {
            echo "## Vale"
            if [ "$PINNED" = "$LATEST" ]; then echo "Pinned $PINNED is current."
            else echo "Pinned $PINNED, latest $LATEST — update VALE_VERSION and the SHA-256 table in v3/scripts/vale-install.ts."; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dependabot PRs open longer than ${{ env.STALE_DAYS }} days (fails)
        run: |
          STALE=$(gh pr list --repo "$GITHUB_REPOSITORY" --author app/dependabot --state open \
            --limit 100 --json number,title,createdAt \
            --jq "[.[] | select((now - (.createdAt | fromdateiso8601)) > ($STALE_DAYS * 86400))]
                  | .[] | \"#\(.number) (open since \(.createdAt[:10])): \(.title)\"")
          {
            echo "## Dependabot PRs open > $STALE_DAYS days"
            if [ -n "$STALE" ]; then echo "$STALE" | sed 's/^/- /'; else echo 'None.'; fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$STALE" ]; then
            echo "::error::Dependabot PRs open longer than $STALE_DAYS days — merge, fix or close them:"
            echo "$STALE"
            exit 1
          fi

  # Mutation testing (T11c, ADR-0059): how many planted bugs the unit tests detect. Too slow for
  # every push (~30 min); fails below the break threshold in v3/stryker.config.mjs — a run that
  # silently tests nothing (stryker-js#6210) scores ~0 and turns this red.
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: v3/package-lock.json

      - name: Install dependencies
        working-directory: v3
        run: npm ci

      - name: Mutation testing (StrykerJS)
        working-directory: v3
        run: npm run test:mutation

      # Score + timeout share; fails above 5 % timeouts (a starved runner inflates the score).
      - name: Mutation score and timeout share
        if: always()
        working-directory: v3
        run: npm run mutation:report

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-report
          path: v3/reports/mutation/
          retention-days: 30
