name: Weekly check

# Runs the full test suite once a week even when nobody pushes (T8c, 2026-09-29):
# new advisories against unchanged packages, runner/browser changes and forgotten
# Dependabot PRs surface without a push. (A failing Dependabot PR stayed unnoticed
# for two months before this existed.)
#
# A red run is the notification: GitHub mails failed scheduled runs. Warnings alone
# would go unseen, so stale Dependabot PRs fail the maintenance job on purpose.
# Note: GitHub disables schedules in public repos after 60 days without activity.
on:
  schedule:
    - cron: '0 6 * * 1' # Monday 06:00 UTC — after Dependabot's Monday run
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  # The exact suite of tests.yml (reused, not copied — cannot drift).
  tests:
    uses: ./.github/workflows/tests.yml

  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STALE_DAYS: 14
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: v3/package-lock.json

      - name: Install dependencies
        working-directory: v3
        run: npm ci

      - name: npm audit — all levels (report; high/critical already block in tests)
        working-directory: v3
        run: |
          {
            echo '## npm audit (all levels)'
            echo '```'
            npm audit || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: npm outdated (report)
        working-directory: v3
        run: |
          {
            echo '## npm outdated'
            echo '```'
            npm outdated || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Vale version (report; Vale is pinned outside npm — ADR-0056)
        run: |
          PINNED=$(grep -oE "VALE_VERSION = '[0-9.]+'" v3/scripts/vale-install.ts | grep -oE "[0-9.]+")
          LATEST=$(gh api repos/vale-cli/vale/releases/latest --jq .tag_name | sed 's/^v//')
          {
            echo "## Vale"
            if [ "$PINNED" = "$LATEST" ]; then echo "Pinned $PINNED is current."
            else echo "Pinned $PINNED, latest $LATEST — update VALE_VERSION and the SHA-256 table in v3/scripts/vale-install.ts."; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dependabot PRs open longer than ${{ env.STALE_DAYS }} days (fails)
        run: |
          STALE=$(gh pr list --repo "$GITHUB_REPOSITORY" --author app/dependabot --state open \
            --limit 100 --json number,title,createdAt \
            --jq "[.[] | select((now - (.createdAt | fromdateiso8601)) > ($STALE_DAYS * 86400))]
                  | .[] | \"#\(.number) (open since \(.createdAt[:10])): \(.title)\"")
          {
            echo "## Dependabot PRs open > $STALE_DAYS days"
            if [ -n "$STALE" ]; then echo "$STALE" | sed 's/^/- /'; else echo 'None.'; fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$STALE" ]; then
            echo "::error::Dependabot PRs open longer than $STALE_DAYS days — merge, fix or close them:"
            echo "$STALE"
            exit 1
          fi

  # Mutation testing (T11c, ADR-0059): how many planted bugs the unit tests detect. Too slow for
  # every push. One job per module (list from stryker.config.mjs via mutation:modules); each mutant
  # runs only `vitest related <module>`. One job for everything was killed twice by the runner
  # after 11–18 min with ~2 h still to go (weekly runs 36770237372, 36775054865).
  mutation-modules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      modules: ${{ steps.list.outputs.modules }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: v3/package-lock.json

      - name: Install dependencies
        working-directory: v3
        run: npm ci

      - name: List the modules to mutate
        id: list
        working-directory: v3
        run: echo "modules=$(npm run -s mutation:modules)" >> "$GITHUB_OUTPUT"

  mutation:
    needs: mutation-modules
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.mutation-modules.outputs.modules) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: v3/package-lock.json

      - name: Install dependencies
        working-directory: v3
        run: npm ci

      - name: Mutation testing (StrykerJS) — ${{ matrix.module }}
        working-directory: v3
        env:
          MUTATE_MODULE: ${{ matrix.module }}
        # Memory every 60 s in the log (evidence if the runner dies again).
        # MUTATION_SECONDS: runtime for mutation:report (fails above 70 % of timeout-minutes).
        run: |
          ( while true; do free -m | awk 'NR==2 {print "memory: " $3 " of " $2 " MB used"}'; sleep 60; done ) &
          START=$(date +%s)
          npm run test:mutation; RC=$?
          echo "MUTATION_SECONDS=$(( $(date +%s) - START ))" >> "$GITHUB_ENV"
          exit $RC

      # Score + timeout share of this module; fails above 5 % timeouts (at least three) or 70 % of
      # the time limit.
      - name: Mutation score and timeout share
        if: always()
        working-directory: v3
        run: npm run mutation:report

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-${{ strategy.job-index }}
          path: v3/reports/mutation/
          retention-days: 30

  # The score over all modules against the break threshold of stryker.config.mjs.
  mutation-summary:
    needs: [mutation-modules, mutation]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # A module job that failed or never reported must not leave a green summary over the rest
      # (weekly run 36825054856: engine.ts died, the summary scored the other nine and passed).
      - name: Every module job succeeded
        if: needs.mutation.result != 'success'
        run: |
          echo "::error::A mutation module job did not succeed (result: ${{ needs.mutation.result }}) — the summary would miss it."
          exit 1

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: v3/package-lock.json

      - name: Install dependencies
        working-directory: v3
        run: npm ci

      - uses: actions/download-artifact@v8
        with:
          pattern: mutation-*
          path: v3/reports/parts

      - name: Mutation score over all modules (fails below the break threshold)
        working-directory: v3
        env:
          MODULES: ${{ needs.mutation-modules.outputs.modules }}
        run: |
          EXPECTED=$(node -e "console.log(JSON.parse(process.env.MODULES).length)")
          FOUND=$(ls reports/parts/*/mutation.json | wc -l)
          if [ "$FOUND" -ne "$EXPECTED" ]; then
            echo "::error::$FOUND mutation reports for $EXPECTED modules."
            exit 1
          fi
          npm run mutation:report -- reports/parts/*/mutation.json --break
