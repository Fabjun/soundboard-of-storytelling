name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # reused by weekly.yml (T8c)

jobs:
  unit-build-lint:
    runs-on: ubuntu-26.04 # probe only, never merged
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history: the commit-message check reads the PR's commits

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: v3/package-lock.json

      - name: Install dependencies
        working-directory: v3
        run: npm ci

      # Pull requests only: catches commits made with --no-verify past the commit-msg hook (ADR-0060).
      - name: Commit messages follow Conventional Commits (pull requests)
        if: github.event_name == 'pull_request'
        working-directory: v3
        run: npx --no -- commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - name: Security audit (blocking at high/critical)
        working-directory: v3
        run: npm audit --audit-level=high

      - name: Build (tsc -b type-checks app, tests, configs, scripts — ADR-0055)
        working-directory: v3
        run: npm run build

      - name: Unit tests + coverage floor
        working-directory: v3
        run: npm run test:coverage

      - name: Lint
        working-directory: v3
        run: npm run lint

      - name: Unused files, exports and dependencies (knip)
        working-directory: v3
        run: npm run knip

      - name: Format check
        working-directory: v3
        run: npm run format:check

      - name: Bundle size
        working-directory: v3
        run: npm run size

      - name: Docs sync check
        working-directory: v3
        run: |
          npm run sync:docs
          git diff --exit-code -- ../docs/architecture/README.md ../docs/design/design-system.md ../docs/development/testing.md ../docs/development/exceptions.md ../CHANGELOG.md \
            || { echo "❌ Generated docs are stale — run npm run sync:docs locally and commit."; exit 1; }

      - name: Vale — superseded terms in active docs (ADR-0056)
        working-directory: v3
        run: npm run lint:docs

      - name: Link integrity check
        working-directory: v3
        run: npm run link:check

      - name: Inline style audit (informational)
        working-directory: v3
        run: npm run audit:inline-styles
        continue-on-error: true

  e2e-smoke:
    runs-on: ubuntu-26.04 # probe only, never merged
    needs: unit-build-lint
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: v3/package-lock.json

      - name: Install dependencies
        working-directory: v3
        run: npm ci

      - name: Install Playwright browsers
        working-directory: v3
        run: npx playwright install --with-deps chromium webkit

      - name: Run smoke E2E tests
        working-directory: v3
        run: npm run test:e2e:smoke

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-smoke-report
          path: v3/playwright-report/
          retention-days: 7

  e2e-mobile:
    runs-on: ubuntu-26.04 # probe only, never merged
    needs: unit-build-lint
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: v3/package-lock.json

      - name: Install dependencies
        working-directory: v3
        run: npm ci

      - name: Install Playwright browsers (WebKit + Chromium)
        working-directory: v3
        run: npx playwright install --with-deps webkit chromium

      - name: Run mobile E2E tests
        working-directory: v3
        run: npm run test:e2e:mobile

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-mobile-report
          path: v3/playwright-report/
          retention-days: 7

  e2e-full:
    runs-on: ubuntu-26.04 # probe only, never merged
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: v3/package-lock.json

      - name: Install dependencies
        working-directory: v3
        run: npm ci

      - name: Install Playwright browsers (Chromium + WebKit)
        working-directory: v3
        run: npx playwright install --with-deps chromium webkit

      - name: Run full E2E tests (Chromium + WebKit subset)
        working-directory: v3
        # probe only: the suspect combo test, 15 times each way, WebKit
        run: npx playwright test tests/e2e/combo-editor.spec.ts tests/e2e/combo-probe.spec.ts --project=full-webkit -g "keeps its steps" --repeat-each=15 --retries=0

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-full-report
          path: v3/playwright-report/
          retention-days: 7

  e2e-prod:
    runs-on: ubuntu-26.04 # probe only, never merged
    needs: unit-build-lint
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: v3/package-lock.json

      - name: Install dependencies
        working-directory: v3
        run: npm ci

      - name: Install Playwright browsers (Chromium only)
        working-directory: v3
        run: npx playwright install --with-deps chromium

      - name: Run E2E against the production build (smoke + full + PWA)
        working-directory: v3
        run: npm run test:e2e:prod

      # The exact build these tests just passed is what deploy-pages.yml publishes
      # (T8d / ADR-0049) — the deploy never rebuilds.
      - name: Keep the tested build for deployment
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: pages-dist
          path: v3/dist/
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-prod-report
          path: v3/playwright-report/
          retention-days: 7
