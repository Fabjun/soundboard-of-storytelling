name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-build-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: v3/package-lock.json

      - name: Install dependencies
        working-directory: v3
        run: npm ci

      - name: Build
        working-directory: v3
        run: npm run build

      - name: Unit tests + coverage floor
        working-directory: v3
        run: npm run test:coverage

      - name: Lint
        working-directory: v3
        run: npm run lint

      - name: Format check
        working-directory: v3
        run: npm run format:check

      - name: Bundle size
        working-directory: v3
        run: npm run size

      - name: Docs sync check
        working-directory: v3
        run: |
          npm run sync:docs
          git diff --exit-code -- ../docs/architecture/README.md ../DESIGN_SYSTEM.md \
            || { echo "❌ Doku veraltet — npm run sync:docs lokal ausführen und committen."; exit 1; }

      - name: Link integrity check
        working-directory: v3
        run: npm run link:check

      - name: Inline style audit (informational)
        working-directory: v3
        run: npm run audit:inline-styles
        continue-on-error: true

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: unit-build-lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: v3/package-lock.json

      - name: Install dependencies
        working-directory: v3
        run: npm ci

      - name: Install Playwright browsers
        working-directory: v3
        run: npx playwright install --with-deps chromium webkit

      - name: Run smoke E2E tests
        working-directory: v3
        run: npm run test:e2e:smoke

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-smoke-report
          path: v3/playwright-report/
          retention-days: 7

  e2e-mobile:
    runs-on: ubuntu-latest
    needs: unit-build-lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: v3/package-lock.json

      - name: Install dependencies
        working-directory: v3
        run: npm ci

      - name: Install Playwright browsers (WebKit + Chromium)
        working-directory: v3
        run: npx playwright install --with-deps webkit chromium

      - name: Run mobile E2E tests
        working-directory: v3
        run: npm run test:e2e:mobile

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-mobile-report
          path: v3/playwright-report/
          retention-days: 7

  e2e-full:
    runs-on: ubuntu-latest
    needs: unit-build-lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: v3/package-lock.json

      - name: Install dependencies
        working-directory: v3
        run: npm ci

      - name: Install Playwright browsers (Chromium + WebKit)
        working-directory: v3
        run: npx playwright install --with-deps chromium webkit

      - name: Run full E2E tests (Chromium + WebKit subset)
        working-directory: v3
        run: npm run test:e2e:full

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-full-report
          path: v3/playwright-report/
          retention-days: 7

  e2e-prod:
    runs-on: ubuntu-latest
    needs: unit-build-lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: v3/package-lock.json

      - name: Install dependencies
        working-directory: v3
        run: npm ci

      - name: Install Playwright browsers (Chromium only)
        working-directory: v3
        run: npx playwright install --with-deps chromium

      - name: Run E2E against the production build (smoke + full + PWA)
        working-directory: v3
        run: npm run test:e2e:prod

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-prod-report
          path: v3/playwright-report/
          retention-days: 7
