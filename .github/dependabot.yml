version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/v3'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
    # Minor/patch updates are bundled per dependency type; MAJOR updates are NOT grouped
    # (except the lockstep families below), so each arrives as its own PR and can be reviewed. (Until 2026-09-29 one
    # group held everything: a single failing major — TypeScript 7 — blocked 14 safe
    # updates incl. security fixes for two months, unnoticed.)
    groups:
      # Families released in lockstep — some pin each other's exact version as a peer — must
      # update together, majors included, or `npm ci` fails on the peer conflict (vitest 5 PR,
      # 2026-09-30). Listed first: a dependency joins the first group that matches.
      # Guarded by v3/tests/unit/testGuards.test.ts (exact peer pins must share a group).
      vitest:
        patterns: ['vitest', '@vitest/coverage-v8', '@vitest/ui']
      typescript-eslint:
        patterns: ['@typescript-eslint/*']
      size-limit:
        patterns: ['size-limit', '@size-limit/*']
      fontsource:
        patterns: ['@fontsource/*']
      dev-minor-patch:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
      prod-minor-patch:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'

    # Deliberately ignored majors (ADR-0053: rule + reason + review trigger; listed in the
    # exception register). The comment directly above each entry is its reason.
    ignore:
      # @types/node follows the Node runtime (.nvmrc); a newer major describes APIs the runtime lacks — raise with .nvmrc (guarded by testGuards)
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # typescript-eslint supports only TypeScript <6.1.0 (peer) — review when it supports 7 (BACKLOG "Major dependency updates")
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    labels:
      - 'ci'
