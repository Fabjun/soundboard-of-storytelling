# American English everywhere (owner decision 2026-10-04): British forms get the American one.
# Verbatim quotations and third-party texts keep their spelling (mark them with
# <!-- vale SoS.AmericanSpelling = NO --> … = YES). This list is also read by
# v3/tests/unit/codeGuards.test.ts for every tracked file that is not Markdown.
extends: substitution
message: "American spelling: use '%s' instead of '%s'."
level: error
ignorecase: true
matchcase: true
swap:
